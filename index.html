<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Geotécnico - Envoltória</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #eceff1; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .controls { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 5px solid #3498db; }
        .control-group { margin-bottom: 15px; }
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #219150; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        canvas { background: #fff; border: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Análise de Interface Solo-Emulsão</h1>
        
        <div class="grid">
            <div class="controls">
                <h3>Configurar Ensaio</h3>
                <div class="control-group">
                    <label>Tensão Normal (σn): <span id="valSigma">100</span> kPa</label>
                    <input type="range" id="sigmaN" min="50" max="500" value="100" style="width:100%">
                </div>
                <div class="control-group">
                    <label>Adesão (c): <span id="valC">20</span> kPa</label>
                    <input type="range" id="coesao" min="0" max="100" value="20" style="width:100%">
                </div>
                <div class="control-group">
                    <label>Ângulo Atrito (δ): <span id="valPhi">30</span>°</label>
                    <input type="range" id="phi" min="10" max="45" value="30" style="width:100%">
                </div>
                <button onclick="registrarEnsaio()">Registrar Ponto na Envoltória</button>
                <button onclick="limparEnsaios()" style="background:#e74c3c; margin-top:10px;">Limpar Tudo</button>
            </div>

            <div>
                <h3>Pontos Registrados</h3>
                <table id="tabelaEnsaios">
                    <thead>
                        <tr>
                            <th>Ensaio</th>
                            <th>σn (kPa)</th>
                            <th>τ pico (kPa)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="charts-container">
            <div>
                <canvas id="chartCurva"></canvas>
            </div>
            <div>
                <canvas id="chartEnvoltoria"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
