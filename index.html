<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSim - Elementos Finitos & Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; color: var(--primary); }
        .wrapper { display: grid; grid-template-columns: 350px 1fr; height: 100vh; }
        
        /* Painel Lateral */
        .sidebar { background: white; padding: 20px; border-right: 1px solid #ddd; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .control-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9em; }
        input[type="range"] { width: 100%; cursor: pointer; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-add { background: var(--success); color: white; }
        .btn-clear { background: var(--danger); color: white; }
        
        /* Área Principal */
        .main-content { padding: 20px; overflow-y: auto; }
        .card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .mef-container { background: #1a1a1a; border-radius: 8px; position: relative; overflow: hidden; }
        canvas { width: 100%; display: block; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        h2 { margin-top: 0; font-size: 1.2em; border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
        .stats { display: flex; justify-content: space-between; font-family: monospace; background: #eee; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <h2>Configurações</h2>
            <div class="control-group">
                <label>Tensão Normal (σn): <span id="valSigma">100</span> kPa</label>
                <input type="range" id="sigmaN" min="20" max="500" value="100">
            </div>
            <div class="control-group">
                <label>Adesão Interface (c): <span id="valC">25</span> kPa</label>
                <input type="range" id="coesao" min="0" max="100" value="25">
            </div>
            <div class="control-group">
                <label>Ângulo de Atrito (δ): <span id="valPhi">30</span>°</label>
                <input type="range" id="phi" min="5" max="45" value="30">
            </div>
            <div class="control-group">
                <label>Deslocamento (ΔL): <span id="valDx">5</span> mm</label>
                <input type="range" id="dx" min="0" max="15" step="0.1" value="5">
            </div>
            <button class="btn-add" onclick="registrarPonto()">Registrar Ensaio</button>
            <button class="btn-clear" onclick="limparTudo()">Limpar Dados</button>
            
            <div style="margin-top: 30px;">
                <h2>Resultados</h2>
                <div id="listaEnsaios"></div>
            </div>
        </aside>

        <main class="main-content">
            <div class="card mef-container">
                <h2 style="color: white; border-color: #555;">Visualização de Elementos Finitos (Stress Map)</h2>
                <canvas id="canvasMEF" width="800" height="250"></canvas>
            </div>

            <div class="charts-grid">
                <div class="card">
                    <h2>Tensão x Deslocamento</h2>
                    <canvas id="chartCurva"></canvas>
                </div>
                <div class="card">
                    <h2>Envoltória de Resistência</h2>
                    <canvas id="chartEnvoltoria"></canvas>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
